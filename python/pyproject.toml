[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlog"
version = "0.1.0"
description = "Tamper-proof audit trails for AI agents. Verifiable by anyone. Alterable by no one."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ARETE (James C. Young)" }]
keywords = ["ai", "audit", "blockchain", "base", "compliance", "immutable", "logging", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "web3>=7.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://github.com/AreteDriver/chainlog"
Repository = "https://github.com/AreteDriver/chainlog"
Issues = "https://github.com/AreteDriver/chainlog/issues"
Changelog = "https://github.com/AreteDriver/chainlog/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
