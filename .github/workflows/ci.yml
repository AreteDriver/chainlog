name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"

jobs:
  test:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

  lint:
    name: Solidity Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile (validates syntax)
        run: npm run compile

  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "sdk/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: sdk

      - name: Build
        run: npm run build
        working-directory: sdk

      - name: Run tests
        run: npm test
        working-directory: sdk

  cli-test:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "cli/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Type check
        run: npm run lint
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Run tests
        run: npm test
        working-directory: cli

  python-test:
    name: Python SDK Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: python

      - name: Lint
        run: ruff check src/ tests/ && ruff format --check src/ tests/
        working-directory: python

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: python
